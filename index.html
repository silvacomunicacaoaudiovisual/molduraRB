            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            display: block;
            position: relative;
            z-index: 1;

        .brand-logo::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;

                90deg,

        @keyframes shineLogo {

        /* Estilo da Faixa */

        /* Seção do Gerador de Moldura */
        .moldura-section {
            width: 100%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);

            margin-bottom: 24px;
            display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .moldura-section h2 {
            font-size: 18px;
            margin-bottom: 8px;

        .moldura-section p {

        /* Borda branca no círculo central */
        .editor-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #090d16;
            box-shadow: 0 0 0 4px #ffffff, 0 10px 25px rgba(0,0,0,0.5);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .zoom-control {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .zoom-control label {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }

        .zoom-control input[type="range"] {
            width: 100%;
            accent-color: #fbbf24;
            cursor: pointer;
        }

        /* Botões de Ação do Gerador (Brancos) */
        .btn-acao {
            width: 100%;
            padding: 14px;
            border-radius: 14px;

            font-size: 14px;
            border: none;
            cursor: pointer;
            display: flex;

            justify-content: center;

            background: #ffffff;
            color: #11358a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-acao:hover {

        .btn-baixar {

        .btn-fechar {
            background: transparent;

        .social-footer {

        .social-icon {

            display: flex;

            justify-content: center;

        .social-icon:hover {

        .legal-footer {

            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 14px;
            line-height: 1.4;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Logo da Campanha com Efeito de Brilho -->

            </button>

            <a href="https://www.facebook.com/RayfranBeiraooficial?mibextid=wwXIfr&rdid=Wc88VO0eccqw1ngk&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1D7FzZQ5F9%2F%3Fmibextid%3DwwXIfr%26utm_source%3Dig%26utm_medium%3Dsocial%26utm_content%3Dlink_in_bio#" target="_blank" class="menu-btn">

        <!-- SEÇÃO DA MOLDURA -->

            <h2>Monte sua Foto com a Moldura</h2>
            <p>Escolha como deseja enviar sua foto, ajuste o enquadramento e baixe pronta para usar!</p>

            <div class="editor-wrapper">
                <canvas id="canvas" width="600" height="600"></canvas>
                <img src="moldura.png" alt="Moldura" class="moldura-overlay">
            </div>

            <div class="zoom-control" id="zoomControl" style="display: none;">
                <label for="zoomRange">Ajustar zoom e posição:</label>
                <input type="range" id="zoomRange" min="0.4" max="3" step="0.01" value="1">

            <!-- Inputs de arquivo ocultos separados para Câmera e Galeria -->

            <!-- Botões de escolha iniciais -->
            <div id="selectSourceButtons" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
                <button class="btn-acao" id="cameraBtn">
                    <i class="fa-solid fa-camera"></i> Tirar foto com a câmera
                </button>
                <button class="btn-acao" id="galleryBtn" style="background: #f1f5f9; color: #11358a;">
                    <i class="fa-solid fa-images"></i> Escolher da galeria
                </button>
            </div>

            <!-- Botão de Trocar Foto (aparece após carregar) -->
            <button class="btn-acao" id="trocarFotoBtn" style="display: none; background: #f1f5f9; color: #11358a; margin-bottom: 10px;">
                <i class="fa-solid fa-rotate"></i> Escolher outra foto
            </button>

        <!-- Rodapé com Ícones Sociais (Apenas Instagram e Facebook) -->

            <a href="https://www.instagram.com/rayfranbeiraoap/" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/RayfranBeiraooficial?mibextid=wwXIfr&rdid=Wc88VO0eccqw1ngk&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1D7FzZQ5F9%2F%3Fmibextid%3DwwXIfr%26utm_source%3Dig%26utm_medium%3Dsocial%26utm_content%3Dlink_in_bio#" target="_blank" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>

        <div class="legal-footer">

    </div>

    <script>
        const openMolduraBtn = document.getElementById('openMolduraBtn');
        const molduraSection = document.getElementById('molduraSection');
        const closeMolduraBtn = document.getElementById('closeMolduraBtn');

        openMolduraBtn.addEventListener('click', () => {
            molduraSection.style.display = 'block';
            molduraSection.scrollIntoView({ behavior: 'smooth' });
        });

        closeMolduraBtn.addEventListener('click', () => {
            molduraSection.style.display = 'none';
        });

        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const galleryBtn = document.getElementById('galleryBtn');
        const selectSourceButtons = document.getElementById('selectSourceButtons');
        const trocarFotoBtn = document.getElementById('trocarFotoBtn');

        const downloadBtn = document.getElementById('downloadBtn');
        const zoomControl = document.getElementById('zoomControl');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const zoomRange = document.getElementById('zoomRange');

        let userImage = new Image();
        let isImageLoaded = false;
        let imgX = 0;
        let imgY = 0;
        let scale = 1;
        let isDragging = false;
        let startX, startY;

        // Disparar Câmera
        cameraBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        // Disparar Galeria
        galleryBtn.addEventListener('click', () => {
            galleryInput.click();
        });

        // Botão para resetar e escolher outra foto
        trocarFotoBtn.addEventListener('click', () => {
            selectSourceButtons.style.display = 'flex';
            trocarFotoBtn.style.display = 'none';
            zoomControl.style.display = 'none';
            downloadBtn.style.display = 'none';
            isImageLoaded = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function handleImageProcess(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImage.src = event.target.result;
                    userImage.onload = function() {
                        isImageLoaded = true;
                        zoomControl.style.display = 'block';
                        downloadBtn.style.display = 'flex';
                        selectSourceButtons.style.display = 'none';
                        trocarFotoBtn.style.display = 'flex';

                        scale = Math.max(canvas.width / userImage.width, canvas.height / userImage.height);
                        zoomRange.value = scale;
                        imgX = (canvas.width - userImage.width * scale) / 2;
                        imgY = (canvas.height - userImage.height * scale) / 2;
                        
                        drawImage();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        cameraInput.addEventListener('change', handleImageProcess);
        galleryInput.addEventListener('change', handleImageProcess);

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isImageLoaded) {
                ctx.save();
                ctx.translate(imgX, imgY);
                ctx.scale(scale, scale);
                ctx.drawImage(userImage, 0, 0);
                ctx.restore();
            }
        }

        zoomRange.addEventListener('input', (e) => {
            const oldScale = scale;
            scale = parseFloat(e.target.value);
            imgX = canvas.width / 2 - (canvas.width / 2 - imgX) * (scale / oldScale);
            imgY = canvas.height / 2 - (canvas.height / 2 - imgY) * (scale / oldScale);
            drawImage();
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isImageLoaded) return;
            isDragging = true;
            startX = e.clientX - imgX;
            startY = e.clientY - imgY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            imgX = e.clientX - startX;
            imgY = e.clientY - startY;
            drawImage();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            if (!isImageLoaded) return;
            isDragging = true;
            startX = e.touches[0].clientX - imgX;
            startY = e.touches[0].clientY - imgY;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            imgX = e.touches[0].clientX - startX;
            imgY = e.touches[0].clientY - startY;
            drawImage();
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        downloadBtn.addEventListener('click', () => {
            if (!isImageLoaded) return;

            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            // No iOS, a janela precisa ser aberta IMEDIATAMENTE no clique
            // (de forma síncrona), antes de qualquer processamento assíncrono,
            // senão o Safari bloqueia como pop-up e nada acontece.
            let win = null;
            if (isiOS) {
                win = window.open('', '_blank');
                if (win) {
                    win.document.write(`
                        <html>
                            <head><title>Salvar Foto</title></head>
                            <body style="background:#11358a; text-align:center; color:white; font-family:sans-serif; padding:20px;">
                                <h2>Preparando sua foto...</h2>
                            </body>
                        </html>
                    `);
                }
            }

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 600;
            finalCanvas.height = 600;
            const finalCtx = finalCanvas.getContext('2d');

            finalCtx.save();
            finalCtx.translate(imgX, imgY);
            finalCtx.scale(scale, scale);
            finalCtx.drawImage(userImage, 0, 0);
            finalCtx.restore();

            const molduraImg = new Image();
            molduraImg.crossOrigin = "anonymous";
            molduraImg.src = document.querySelector('.moldura-overlay').src;
            molduraImg.onload = function() {
                finalCtx.drawImage(molduraImg, 0, 0, finalCanvas.width, finalCanvas.height);
                const dataURL = finalCanvas.toDataURL('image/png');

                if (isiOS) {
                    if (win) {
                        win.document.open();
                        win.document.write(`
                            <html>
                                <head><title>Salvar Foto</title></head>
                                <body style="background:#11358a; text-align:center; color:white; font-family:sans-serif; padding:20px;">
                                    <h2>Toque e segure na foto abaixo e escolha "Salvar Imagem"</h2>
                                    <img src="${dataURL}" style="width:100%; max-width:350px; border-radius:50%; margin-top:15px; box-shadow:0 5px 15px rgba(0,0,0,0.5);">
                                </body>
                            </html>
                        `);
                        win.document.close();
                    } else {
                        alert('Não foi possível abrir a janela para salvar. Toque e segure na imagem para salvá-la.');
                        const link = document.createElement('a');
                        link.href = dataURL;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                } else {
                    const link = document.createElement('a');
                    link.download = 'Rayfran-Beirao-10678-perfil.png';
                    link.href = dataURL;
                    link.click();
                }
            };
        });
    </script>
</body>
</html>
